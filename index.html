<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>houkoku-tools</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#17202a;--muted:#667085;--line:#d9e0e8;--accent:#2457c5;--accentbg:#eef3ff}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}main{max-width:900px;margin:0 auto;padding:36px 18px 56px}h1{font-size:32px;margin:0 0 8px}.lead{color:var(--muted);margin:0 0 26px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;min-height:190px}.card h2{font-size:18px;margin:0 0 8px}.card p{color:var(--muted);font-size:14px;margin:0 0 16px}.card a,.pending{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:9px;padding:10px 13px;font-weight:700}.card a{background:var(--accent);color:#fff}.pending{background:#eef1f5;color:#667085}.note{margin-top:22px;padding:14px 16px;background:#fff7e6;border:1px solid #ecd9a6;border-radius:12px;font-size:13px}.privacy{margin-top:14px;padding:14px 16px;background:var(--accentbg);border:1px solid #cad7f7;border-radius:12px;font-size:13px}footer{margin-top:28px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
<h1>houkoku-tools</h1>
<p class="lead">介護サービス情報公表などの申請作業を少し楽にする、ローカル処理中心の小さな工具箱です。</p>
<section class="grid">
  <article class="card">
    <h2>公正中立性集計ツール</h2>
    <p>カイポケのサービス利用票PDFから、前6か月の利用割合と事業所別割合を集計します。</p>
    <span class="pending">準備中</span>
  </article>
  <article class="card">
    <h2>従業者集計ツール</h2>
    <p>職種・勤務回数・勤務時間などから、常勤／非常勤と常勤換算人数をまとめます。</p>
    <a href="staffing-summary/">開く</a>
  </article>
</section>
<div class="privacy"><strong>プライバシー:</strong> 各ツールは入力したPDFやExcelを外部サーバーへ送信しない構成です。</div>
<div class="note"><strong>注意:</strong> 個人の業務補助用ツールです。制度・法令・自治体運用の正式判断を代替しません。申請前に最新の公式資料と実データを確認してください。</div>
<footer>houkoku-tools</footer>
</main>
</body>
</html>
